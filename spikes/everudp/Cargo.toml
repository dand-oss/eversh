[package]
name = "everudp-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Disposable Stage D spike: terminal echo prediction over QUIC datagrams and encrypted UDP"

[dependencies]
aes-gcm = { version = "0.10", features = ["aes"] }
noq = { version = "=1.1.1", default-features = false, features = ["runtime-tokio", "rustls", "ring", "bloom"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[workspace]
