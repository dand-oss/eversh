[workspace]
resolver = "2"
members = [
    "crates/everpty",
    "crates/everssh",
    "crates/everudp",
    "crates/eversh",
]
exclude = ["fuzz", "spikes", "vendor/noq", "vendor/noq-proto"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
rust-2018-idioms = "warn"
# Set only by the isolated Quinn evaluation package, never a workspace feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(everudp_quinn_evaluation)'] }

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
strip = "debuginfo"
# Measured production improvement; see 20260907-everudp-lto-confirm-b246703.
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"

[patch.crates-io]
noq = { path = "vendor/noq" }
noq-proto = { path = "vendor/noq-proto" }
