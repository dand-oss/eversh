[package]
name = "everpty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Named PTY session broker for eversh (skeleton in M1)"

[features]
default = []
# CLI support at the binary edge only; the library builds without it.
cli = ["dep:clap"]

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }

[lib]
name = "everpty"

[[bin]]
name = "everpty"
required-features = ["cli"]

[lints]
workspace = true
