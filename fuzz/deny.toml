# cargo-deny policy for the separate fuzz workspace: same graph rules as the
# production workspace plus the fuzzer itself. libfuzzer-sys carries
# (MIT OR Apache-2.0) AND NCSA (the LLVM/libFuzzer licence); NCSA is a
# permissive licence allowed HERE ONLY — the fuzz workspace is not part of
# the production dependency graph and is never shipped.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "NCSA", # libfuzzer-sys only, fuzz workspace only
]
confidence-threshold = 0.92

[advisories]
version = 2
yanked = "deny"
ignore = [
  { crate = "chacha20@0.10.1", reason = "Temporarily retain the reviewed noq =1.1.1 transport pin; upgrading noq requires separate transport requalification tracked by eversh-7zi." },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
