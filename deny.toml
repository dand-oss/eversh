# Workspace cargo-deny policy (M0 allow-list, no rcgen ban: rcgen is an
# audited everssh dependency pinned =0.13.2 with only the ring feature).
# clap is permitted only where a CLI feature pulls it in as an optional dep.

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.92

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
deny = [
  # No second SSH implementation, no async runtime besides the single Tokio
  # runtime owned by everssh, no unreviewed crypto providers.
  { name = "russh" },
  { name = "thrussh" },
  { name = "ssh2" },
  { name = "libssh2-sys" },
  { name = "openssh" },
  { name = "async-std" },
  { name = "smol" },
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
