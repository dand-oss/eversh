[workspace]
resolver = "2"
members = [
    "crates/everpty",
    "crates/everlink",
    "crates/eversh",
]
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
rust-2018-idioms = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
strip = "debuginfo"
